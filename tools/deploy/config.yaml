# The build cluster's registrar node (the maintainer, 2026-11-16): one per build server, on the
# lab LAN, plaintext AUTH allowed there by the maintainer's word. The users are in
# secrets.yaml beside this file, never here:
#
#   acl:
#     users:
#       - user default off
#       - user registrar on >... ~node:* +hset +hdel +expire +pexpire +del +ping +hello +client|setname
#       - user reader on >... ~node:* resetchannels &__keyspace@0__:node:* +@read +scan +ping +hello +psubscribe +punsubscribe
#
# Keyspace notifications are on, so a scheduler hears a node register, change
# or expire: PSUBSCRIBE __keyspace@0__:node:*.

notify:
  keyspace_events: Khgx
listen:
  host: 0.0.0.0
  port: 6390
auth:
  plaintext: true
log:
  level: INFO
  format: json
