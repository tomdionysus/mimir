#
# tools/ci.sh's steps on Debian 13, as the nodes have it: the header and format
# check; release builds on x86-64 and on arm64, as a build server builds them; clang with
# its thread-safety analysis; the Debian package on both architectures,
# linted; clang-tidy's use-after-move check; coverage to Codecov. Runs on the build servers
# stay by hand. No sanitizer jobs (the maintainer, 2026-11-17): `tools/ci.sh asan` and
# `tsan` run only before a release, or to hunt a named bug.
name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

permissions:
  contents: read

# A newer push to the same branch supersedes a run still going.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: ${{ matrix.step }} (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { step: check, arch: x86-64, runner: ubuntu-24.04 }
          - { step: release, arch: x86-64, runner: ubuntu-24.04 }
          - { step: release, arch: arm64, runner: ubuntu-24.04-arm }
          - { step: clang, arch: x86-64, runner: ubuntu-24.04 }
    container:
      image: debian:trixie
    steps:
      - name: Install packages
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            g++ clang clang-format libclang-rt-19-dev cmake ninja-build git ca-certificates openssl \
            libboost-dev libssl-dev libyaml-cpp-dev libgtest-dev pkg-config liblua5.1-0-dev lua-cjson-dev lua-bitop-dev lua-cmsgpack

      - uses: actions/checkout@v4

      - name: Trust the checkout
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: ${{ matrix.step }}
        run: tools/ci.sh ${{ matrix.step }}

  package:
    name: package (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x86-64, runner: ubuntu-24.04 }
          - { arch: arm64, runner: ubuntu-24.04-arm }
    container:
      image: debian:trixie
    steps:
      - name: Install packages
        run: |
          apt-get update
          apt-get install -y --no-install-recommends git ca-certificates dpkg-dev lintian

      - uses: actions/checkout@v4

      - name: Trust the checkout
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Dannan's packages, then Mimir's, linted
        run: tools/ci.sh package

  tidy:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    container:
      image: debian:trixie
    steps:
      - name: Install packages
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            clang clang-tidy cmake ninja-build git ca-certificates python3 \
            libboost-dev libssl-dev libyaml-cpp-dev libgtest-dev pkg-config liblua5.1-0-dev lua-cjson-dev lua-bitop-dev lua-cmsgpack

      - uses: actions/checkout@v4

      - name: Trust the checkout
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Use after move
        run: tools/ci.sh tidy

  coverage:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    container:
      image: debian:trixie
    steps:
      - name: Install packages
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            g++ cmake ninja-build git ca-certificates openssl \
            libboost-dev libssl-dev libyaml-cpp-dev libgtest-dev pkg-config liblua5.1-0-dev lua-cjson-dev lua-bitop-dev lua-cmsgpack lcov \
            curl gnupg  # Codecov's uploader verifies its own signature

      - uses: actions/checkout@v4

      - name: Trust the checkout
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Build and test
        run: tools/ci.sh coverage

      - name: Upload coverage
        uses: codecov/codecov-action@v5
        with:
          files: build-ci/coverage.info
          disable_search: true
          token: ${{ secrets.CODECOV_TOKEN }}
          # A failed upload fails the job: coverage that never arrives is not seen.
          fail_ci_if_error: true
