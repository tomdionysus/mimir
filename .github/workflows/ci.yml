#
# tools/ci.sh's steps on Debian 13, as the nodes have it: the header and format
# check; release builds on x86-64 and on arm64, as a Pi builds them; clang with
# its thread-safety analysis; coverage to Codecov. Runs on the Pi build servers
# stay by hand. No sanitizer jobs (Tom, 2026-11-17): `tools/ci.sh asan` and
# `tsan` run only before a release, or to hunt a named bug.
name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

permissions:
  contents: read

# A newer push to the same branch supersedes a run still going.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: ${{ matrix.step }} (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { step: check, arch: x86-64, runner: ubuntu-24.04 }
          - { step: release, arch: x86-64, runner: ubuntu-24.04 }
          - { step: release, arch: arm64, runner: ubuntu-24.04-arm }
          - { step: clang, arch: x86-64, runner: ubuntu-24.04 }
    container:
      image: debian:trixie
    steps:
      - name: Install packages
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            g++ clang clang-format cmake ninja-build git ca-certificates openssl \
            libboost-dev libssl-dev libyaml-cpp-dev libgtest-dev pkg-config liblua5.1-0-dev lua-cjson-dev lua-bitop-dev lua-cmsgpack

      - uses: actions/checkout@v4

      - name: Trust the checkout
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: ${{ matrix.step }}
        run: tools/ci.sh ${{ matrix.step }}

  coverage:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    # Codecov takes the upload on GitHub's OIDC token: the repository has no
    # CODECOV_TOKEN secret, and Codecov refuses a tokenless upload.
    permissions:
      contents: read
      id-token: write
    container:
      image: debian:trixie
    steps:
      - name: Install packages
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            g++ cmake ninja-build git ca-certificates openssl \
            libboost-dev libssl-dev libyaml-cpp-dev libgtest-dev pkg-config liblua5.1-0-dev lua-cjson-dev lua-bitop-dev lua-cmsgpack lcov \
            curl gnupg  # Codecov's uploader verifies its own signature

      - uses: actions/checkout@v4

      - name: Trust the checkout
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Build and test
        run: tools/ci.sh coverage

      - name: Upload coverage
        uses: codecov/codecov-action@v5
        with:
          files: build-ci/coverage.info
          disable_search: true
          use_oidc: true
          # A failed upload fails the job: coverage that never arrives is not seen.
          fail_ci_if_error: true
